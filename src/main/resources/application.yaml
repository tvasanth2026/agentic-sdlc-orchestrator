spring:
  config:
    import: optional:configtree:${CONFIG_TREE:/run/secrets/}
  application:
    name: agentic-sdlc-orchestrator
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agentic_sdlc_orchestrator}
    username: ${DB_USERNAME:agentic}
    password: ${DB_PASSWORD:local-agentic-password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  ssl:
    enabled: ${SERVER_SSL_ENABLED:false}
    certificate: ${SERVER_SSL_CERTIFICATE:}
    certificate-private-key: ${SERVER_SSL_PRIVATE_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

agentic:
  execution:
    deterministic: ${AGENTIC_DETERMINISTIC:true}
    max-attempts: ${AGENTIC_MAX_ATTEMPTS:3}
    workspace-root: ${AGENTIC_WORKSPACE_ROOT:./agent-workspaces}
    clarification-token: ${AGENTIC_CLARIFICATION_TOKEN:local-operator-token}
  repository:
    approved-roots:
      - ${AGENTIC_REPOSITORY_ROOT:./scenario-repositories}
    max-files: ${AGENTIC_REPOSITORY_MAX_FILES:2000}
    max-file-bytes: ${AGENTIC_REPOSITORY_MAX_FILE_BYTES:1048576}
    max-total-bytes: ${AGENTIC_REPOSITORY_MAX_TOTAL_BYTES:52428800}
    max-search-matches: ${AGENTIC_REPOSITORY_MAX_SEARCH_MATCHES:500}
  model:
    provider: ${AGENTIC_MODEL_PROVIDER:deterministic}
    model: ${AGENTIC_MODEL_NAME:deterministic-v1}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1/responses}
    api-key: ${OPENAI_API_KEY:}
    timeout: ${AGENTIC_MODEL_TIMEOUT:PT20S}
    max-context-characters: ${AGENTIC_MODEL_MAX_CONTEXT_CHARS:60000}
    max-output-characters: ${AGENTIC_MODEL_MAX_OUTPUT_CHARS:16000}
  patch:
    max-operations: ${AGENTIC_PATCH_MAX_OPERATIONS:100}
    max-patch-bytes: ${AGENTIC_PATCH_MAX_BYTES:2097152}
    permitted-roots:
      - src/main
      - src/test
      - docs
  validation:
    timeout: ${AGENTIC_VALIDATION_TIMEOUT:PT5M}
    max-output-characters: ${AGENTIC_VALIDATION_MAX_OUTPUT_CHARS:65536}
    retry-backoff: ${AGENTIC_VALIDATION_RETRY_BACKOFF:PT0.1S}
  governance:
    operator-token: ${AGENTIC_OPERATOR_TOKEN:local-operator-token}
    change-approver-token: ${AGENTIC_CHANGE_APPROVER_TOKEN:local-change-approver-token}
    release-approver-token: ${AGENTIC_RELEASE_APPROVER_TOKEN:local-release-approver-token}
  security:
    local:
      username: ${AGENTIC_BASIC_USERNAME:operator}
      password: ${AGENTIC_BASIC_PASSWORD:local-development-only}
  coordination:
    worker-id: ${AGENTIC_WORKER_ID:${HOSTNAME:local-worker}}
    lease-duration: ${AGENTIC_LEASE_DURATION:PT30S}
    recovery-interval: ${AGENTIC_RECOVERY_INTERVAL:PT10S}
