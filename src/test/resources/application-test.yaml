spring:
  datasource:
    url: jdbc:h2:mem:agentic;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

agentic:
  execution:
    workspace-root: ./target/test-workspaces
  repository:
    approved-roots:
      - ./target/test-repositories
